name: Sync Content from GitHub

on:
  schedule:
    - cron: '0 8 * * 1'  # every Monday 8 AM UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Run sync script
        run: node scripts/sync-github.mjs --apply

      - name: Create PR if changes
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: sync blog entries from GitHub activity'
          branch: sync-content
          title: '📝 Weekly content sync from GitHub'
          body: Auto-generated draft blog entries from recent GitHub repos. Review and merge.
          labels: automated
